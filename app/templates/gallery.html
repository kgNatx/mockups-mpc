<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mockups MPC</title>
  <link rel="stylesheet" href="/static/style.css?v={{ version }}">
</head>
<body>
  <div class="shell">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="brand-bar">
        <svg class="frame-mark" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><path d="M2.5 9h19"/><rect class="frame-fill" x="6" y="12" width="7" height="5" rx="1"/></svg>
        <span class="brand-word">Mockups <em>MPC</em></span>
        <span class="brand-readout"><b id="brand-count">0</b> designs &middot; v{{ version }}</span>
        <a class="brand-guide-btn" id="guide-link" href="#" style="display:none" title="Setup Guide" aria-label="Setup Guide">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17v.01"/></svg>
        </a>
      </div>

      <div class="scope-wrap">
        <div class="scope-row">
          <button class="scope-btn" id="scope-btn" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="scope-name" id="scope-name">All projects</span>
            <span class="scope-meta"><span id="scope-count">0</span> &#9662;</span>
          </button>
          <button class="fav-toggle" id="fav-toggle" type="button" aria-pressed="false" title="Favorites">
            <span class="fav-star">&#9733;</span><span id="fav-count">0</span>
          </button>
        </div>
        <div class="scope-pop" id="scope-pop">
          <input
            type="text" class="scope-filter" id="scope-filter"
            placeholder="Filter projects&hellip;"
            autocomplete="off" spellcheck="false"
          >
          <ul class="scope-list" id="scope-list"></ul>
        </div>
      </div>

      <div class="sidebar-filter">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
          <input
            type="text" class="filter-input" id="filter-input"
            placeholder="Search title, description, tags…"
            autocomplete="off" spellcheck="false"
          >
        </div>
        <div class="sort-seg" id="sort-seg">
          <div class="sort-opt active" data-sort="newest">Newest</div>
          <div class="sort-opt" data-sort="oldest">Oldest</div>
          <div class="sort-opt fav-sort" data-sort="favorites">★ First</div>
        </div>
      </div>

      <div class="sidebar-feed" id="feed-container">
        <div class="feed-status" id="feed-status">Loading...</div>
      </div>
    </aside>

    <!-- ===== MAIN VIEWER ===== -->
    <main class="main">
      <div class="meta-bar empty" id="meta-bar">
        <div class="bar-left" id="bar-left">
          <div class="bar-eyebrow">
            <svg class="frame-mark" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><path d="M2.5 9h19"/><rect class="frame-fill" x="6" y="12" width="7" height="5" rx="1"/></svg>
            <span>Mockups&middot;<b>MPC</b></span>
          </div>
          <div class="bar-left-row" id="bar-left-row">
            <button class="menu-toggle" id="menu-toggle" type="button"
                    aria-label="Toggle sidebar" aria-expanded="false" aria-controls="sidebar">
              <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
          </div>
        </div>
        <div class="bar-content" id="bar-content">
          <span class="meta-hint">Select a mockup to preview</span>
        </div>
      </div>
      <div class="viewer" id="viewer">
        <div class="viewer-empty">
          <div class="viewer-empty-icon">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <line x1="3" y1="9" x2="21" y2="9" />
              <line x1="9" y1="3" x2="9" y2="9" />
            </svg>
          </div>
          <div class="viewer-empty-text">No mockup selected</div>
        </div>
      </div>
    </main>

    <!-- ===== MOBILE DRAWER SCRIM ===== -->
    <div class="sidebar-scrim" id="sidebar-scrim"></div>

  </div>

<script>
(function () {
  "use strict";

  /* ── State ── */
  var FAVORITES = "__favorites__";   // sentinel for state.activeProject

  var state = {
    projects: [],
    mockups: [],
    activeProject: null,   // null = all, FAVORITES = favorites filter, else a project slug
    activeMockupId: null,
    activeVersion: null,   // number = pinned to that version, null = follow latest
    filterText: "",
    sort: "newest",
    favoritesCount: 0,
    offset: 0,
    limit: 50,
    loading: false,
    exhausted: false,
    scopeFilterText: ""
  };

  // The full mockup detail (design + versions) behind the current viewer/meta
  // bar render, when known — kept so a re-render triggered by something that
  // only has a feed-row summary (e.g. a favorite toggle) never has to drop
  // down to a shallower object and lose the versions list.
  var activeMockupDetail = null;

  // Version lists fetched per design id (`/api/mockups/{id}`), for the feed
  // row's version chip. Cleared on every feed reload (not on infinite-scroll
  // append), per the task brief.
  var versionsCache = {};

  // Bumped on every fetchAndDisplay call, captured at call time. Two clicks
  // in quick succession (e.g. v2 then v3) both fetch; whichever response
  // lands second used to always win. Now a response is only applied if its
  // token is still the newest — the click order wins, not the network order.
  var fetchSeq = 0;

  var SPLIT_SVG = '<svg viewBox="0 0 24 24"><path d="M6 3v6a3 3 0 0 0 3 3h6a3 3 0 0 1 3 3v6M6 21v-4"/><path d="M15 18l3 3 3-3"/></svg>';

  /* ── DOM refs ── */
  var scopeBtn        = document.getElementById("scope-btn");
  var scopeNameEl      = document.getElementById("scope-name");
  var scopeCountEl     = document.getElementById("scope-count");
  var scopePop         = document.getElementById("scope-pop");
  var scopeFilterInput = document.getElementById("scope-filter");
  var scopeListEl      = document.getElementById("scope-list");
  var favToggle        = document.getElementById("fav-toggle");
  var favCountEl       = document.getElementById("fav-count");
  var brandCountEl     = document.getElementById("brand-count");
  var feedContainer   = document.getElementById("feed-container");
  var feedStatusEl    = document.getElementById("feed-status");
  var filterInput     = document.getElementById("filter-input");
  var metaBar         = document.getElementById("meta-bar");
  var barLeftRow      = document.getElementById("bar-left-row");
  var barContent      = document.getElementById("bar-content");
  var viewer          = document.getElementById("viewer");
  var shell           = document.querySelector(".shell");
  var menuToggle      = document.getElementById("menu-toggle");
  var sidebarScrim    = document.getElementById("sidebar-scrim");

  /* ── Sidebar Toggle ── */
  // Two orthogonal states, each scoped to its own viewport regime so resizing
  // across the breakpoint can never strand a weird state:
  //   mobile  → "nav-open"      : off-canvas drawer slides in (default hidden)
  //   desktop → "sb-collapsed"  : sidebar slides out to reclaim width (default shown)
  var mobileMq = window.matchMedia("(max-width: 720px)");

  function syncToggleAria() {
    if (!menuToggle) return;
    var expanded = mobileMq.matches
      ? shell.classList.contains("nav-open")        // drawer open?
      : !shell.classList.contains("sb-collapsed");  // sidebar showing?
    menuToggle.setAttribute("aria-expanded", expanded ? "true" : "false");
  }

  // Close the mobile drawer. On desktop nav-open is inert, so this is a safe
  // no-op there (e.g. when called from selectMockup or Escape).
  function setNav(open) {
    shell.classList.toggle("nav-open", open);
    syncToggleAria();
  }

  function toggleSidebar() {
    if (mobileMq.matches) {
      setNav(!shell.classList.contains("nav-open"));
    } else {
      shell.classList.toggle("sb-collapsed");
      syncToggleAria();
    }
  }

  if (menuToggle) {
    menuToggle.addEventListener("click", toggleSidebar);
  }
  if (sidebarScrim) {
    sidebarScrim.addEventListener("click", function () { setNav(false); });
  }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") setNav(false);
  });
  // Keep aria-expanded honest when crossing the breakpoint (the two states
  // mean different things on each side).
  mobileMq.addEventListener("change", syncToggleAria);
  syncToggleAria();

  /* ── Helpers ── */
  function el(tag, cls, attrs) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        node.setAttribute(k, attrs[k]);
      });
    }
    return node;
  }

  function text(str) { return document.createTextNode(str); }

  function clearChildren(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  // Make a non-semantic clickable element keyboard-operable: focusable, exposed
  // as a button to assistive tech, and activated by Enter/Space like a click.
  function makeActivatable(node, handler) {
    node.setAttribute("role", "button");
    node.setAttribute("tabindex", "0");
    node.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        handler(e);
      }
    });
  }

  function formatTime(iso) {
    var d = new Date(iso);
    var now = new Date();
    var diff = now - d;
    if (diff < 60000) return "just now";
    if (diff < 3600000) return Math.floor(diff / 60000) + "m ago";
    if (diff < 86400000) return Math.floor(diff / 3600000) + "h ago";
    if (diff < 604800000) return Math.floor(diff / 86400000) + "d ago";
    var month = d.toLocaleString("en", { month: "short" });
    return month + " " + d.getDate();
  }

  function dateKey(iso) {
    var d = new Date(iso);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function formatDateLabel(iso) {
    var d = new Date(iso);
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var diff = today - target;

    if (diff === 0) return "Today";
    if (diff === 86400000) return "Yesterday";
    if (diff < 604800000) return d.toLocaleString("en", { weekday: "long" });
    var month = d.toLocaleString("en", { month: "short" });
    if (d.getFullYear() === now.getFullYear()) return month + " " + d.getDate();
    return month + " " + d.getDate() + ", " + d.getFullYear();
  }

  /* ── Projects ── */
  async function loadProjects() {
    var resp = await fetch("/api/projects");
    state.projects = await resp.json();
    renderProjects();
  }

  async function loadFavoritesCount() {
    try {
      var resp = await fetch("/api/favorites/count");
      var data = await resp.json();
      state.favoritesCount = data.count || 0;
    } catch (e) { /* leave previous value */ }
  }

  // Renders the scope button, the favorites toggle, the brand-bar readout,
  // and (via renderScopeList) the popover's project list — everything that
  // depends on state.projects, state.favoritesCount, or state.activeProject.
  function renderProjects() {
    var total = state.projects.reduce(function (s, p) { return s + p.count; }, 0);

    if (brandCountEl) brandCountEl.textContent = String(total);

    var activeName, activeCount;
    if (state.activeProject === FAVORITES) {
      activeName = "Favorites";
      activeCount = state.favoritesCount || 0;
    } else if (state.activeProject === null) {
      activeName = "All projects";
      activeCount = total;
    } else {
      var active = state.projects.find(function (p) { return p.project_slug === state.activeProject; });
      activeName = active ? active.project : state.activeProject;
      activeCount = active ? active.count : 0;
    }
    scopeNameEl.textContent = activeName;
    scopeCountEl.textContent = String(activeCount);

    favToggle.setAttribute("aria-pressed", state.activeProject === FAVORITES ? "true" : "false");
    favCountEl.textContent = String(state.favoritesCount || 0);

    renderScopeList();
  }

  // The scope popover's project list: "All projects" (pinned), a divider,
  // then every project in /api/projects order (most recently active first),
  // narrowed by state.scopeFilterText (case-insensitive name match).
  function renderScopeList() {
    clearChildren(scopeListEl);

    var total = state.projects.reduce(function (s, p) { return s + p.count; }, 0);
    var filter = state.scopeFilterText.toLowerCase();
    var candidates = [{ name: "All projects", slug: null, count: total }].concat(
      state.projects.map(function (p) {
        return { name: p.project, slug: p.project_slug, count: p.count };
      })
    );
    var matches = filter
      ? candidates.filter(function (c) { return c.name.toLowerCase().indexOf(filter) !== -1; })
      : candidates;

    if (matches.length === 0) {
      var empty = el("li", "scope-empty");
      empty.appendChild(text("No matches"));
      scopeListEl.appendChild(empty);
      return;
    }

    matches.forEach(function (c) {
      var item = el("li", "scope-item" + (state.activeProject === c.slug ? " active" : ""));
      var activate = function () {
        selectProject(c.slug);
        closeAllPopovers();
      };
      item.addEventListener("click", activate);
      makeActivatable(item, activate);
      var name = el("span", "scope-item-name");
      name.appendChild(text(c.name));
      var count = el("span", "scope-item-count");
      count.appendChild(text(String(c.count)));
      item.appendChild(name);
      item.appendChild(count);
      scopeListEl.appendChild(item);

      // Divider right after the pinned "All projects" row, only when there's
      // something below it to separate it from.
      if (c.slug === null && matches.length > 1) {
        scopeListEl.appendChild(el("li", "scope-divider"));
      }
    });
  }

  // Closes every popover in the app: the scope picker and any open viewer-bar
  // menu (viewport, details). R19a: this replaces two independent close
  // systems (closeScopePop + closeMenus) with one, so opening any one of the
  // three popovers always closes the others, and Escape / outside click /
  // window blur close all of them together.
  function closeAllPopovers() {
    scopePop.classList.remove("open");
    scopeBtn.setAttribute("aria-expanded", "false");
    metaBar.querySelectorAll(".meta-pop.open").forEach(function (p) { p.classList.remove("open"); });
    metaBar.querySelectorAll('[aria-haspopup][aria-expanded="true"]').forEach(function (b) {
      b.setAttribute("aria-expanded", "false");
    });
  }

  scopeBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    var wasOpen = scopePop.classList.contains("open");
    closeAllPopovers();
    if (!wasOpen) {
      scopePop.classList.add("open");
      scopeBtn.setAttribute("aria-expanded", "true");
      scopeFilterInput.value = "";
      state.scopeFilterText = "";
      renderScopeList();
      scopeFilterInput.focus();
    }
  });
  scopePop.addEventListener("click", function (e) { e.stopPropagation(); });
  scopeFilterInput.addEventListener("input", function () {
    state.scopeFilterText = scopeFilterInput.value.trim();
    renderScopeList();
  });
  favToggle.addEventListener("click", function () {
    selectProject(state.activeProject === FAVORITES ? null : FAVORITES);
  });
  document.addEventListener("click", closeAllPopovers);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeAllPopovers();
  });
  // A click inside the mockup lands in its iframe and never reaches `document`;
  // the window losing focus to the iframe is the signal instead.
  window.addEventListener("blur", closeAllPopovers);

  function selectProject(slug) {
    state.activeProject = slug;
    state.offset = 0;
    state.exhausted = false;
    state.mockups = [];
    renderProjects();
    loadMockups(true);
  }

  /* ── Mockups Feed ── */
  async function loadMockups(reset) {
    if (state.loading) return;
    if (!reset && state.exhausted) return;

    state.loading = true;

    if (reset) {
      state.offset = 0;
      state.exhausted = false;
      state.mockups = [];
      // "cached per row until the feed reloads" (task brief) — a reload
      // invalidates every row's fetched version list, not just the visible ones.
      versionsCache = {};
      // clear feed but keep container
      var items = feedContainer.querySelectorAll(".feed-item, .feed-date, .feed-loader, .ver-list");
      items.forEach(function (el) { el.remove(); });
      feedStatusEl.textContent = "Loading...";
      feedStatusEl.style.display = "";
    }

    var url = "/api/mockups?limit=" + state.limit + "&offset=" + state.offset
            + "&sort=" + encodeURIComponent(state.sort);
    if (state.activeProject === FAVORITES) {
      url += "&favorites_only=true";
    } else if (state.activeProject) {
      url += "&project=" + encodeURIComponent(state.activeProject);
    }
    if (state.filterText) {
      url += "&q=" + encodeURIComponent(state.filterText);
    }

    var data;
    try {
      var resp = await fetch(url);
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      data = await resp.json();
    } catch (e) {
      // Surface the failure instead of silently freezing the feed forever.
      // The auto-refresh poll will retry and recover on the next tick.
      if (reset) {
        feedStatusEl.textContent = "Couldn't load — retrying…";
        feedStatusEl.style.display = "";
      }
      return;
    } finally {
      // Always release the loading lock, or every later load() would no-op.
      state.loading = false;
    }

    if (data.length < state.limit) state.exhausted = true;
    state.offset += data.length;

    if (reset) state.mockups = data;
    else state.mockups = state.mockups.concat(data);

    renderFeed(reset);
  }

  function renderFeed(isReset) {
    feedStatusEl.style.display = "none";

    // Remove existing loader
    var oldLoader = feedContainer.querySelector(".feed-loader");
    if (oldLoader) oldLoader.remove();

    if (state.mockups.length === 0) {
      feedStatusEl.textContent = "No mockups yet";
      feedStatusEl.style.display = "";
      return;
    }

    var filtered = state.mockups;

    // Always clear and re-render with date separators. Any open .ver-list
    // (a feed row's expanded version history) is torn down with its row —
    // it isn't restored on re-render; see createFeedItem.
    var oldItems = feedContainer.querySelectorAll(".feed-item, .feed-date, .ver-list");
    oldItems.forEach(function (node) { node.remove(); });

    if (filtered.length === 0) {
      feedStatusEl.textContent = "No matches";
      feedStatusEl.style.display = "";
      return;
    }

    var lastDate = null;
    filtered.forEach(function (mockup) {
      var dk = dateKey(mockup.created_at);
      if (dk !== lastDate) {
        lastDate = dk;
        var sep = el("div", "feed-date");
        sep.appendChild(text(formatDateLabel(mockup.created_at)));
        feedContainer.appendChild(sep);
      }
      feedContainer.appendChild(createFeedItem(mockup));
    });
  }

  function createFeedItem(mockup) {
    var item = el("div", "feed-item" + (mockup.id === state.activeMockupId ? " active" : ""));
    item.setAttribute("data-id", mockup.id);
    if (mockup.favorite) item.classList.add("has-fav");

    var activate = function () {
      // Re-clicking the active row while pinned to an older version goes to
      // the latest (spec §8.1: "row click still opens the latest") rather
      // than deselecting — deselect-on-reclick only applies when it's
      // already showing the latest (nothing left for a click to do but close it).
      if (state.activeMockupId === mockup.id) {
        if (state.activeVersion != null) selectMockup(mockup.id);
        else deselectMockup();
      } else {
        selectMockup(mockup.id);
      }
    };
    item.addEventListener("click", activate);
    makeActivatable(item, activate);

    var title = el("div", "feed-title");
    var titleText = el("span", "feed-title-text");
    titleText.appendChild(text(mockup.title));
    title.appendChild(titleText);
    title.addEventListener("mouseenter", function () {
      var overflow = titleText.offsetWidth - title.clientWidth;
      if (overflow > 0) {
        var dur = Math.max(2, overflow / 30);
        title.style.setProperty("--scroll-dist", -(overflow + 8) + "px");
        title.style.setProperty("--scroll-dur", dur + "s");
        title.classList.add("scrolling");
      }
    });
    title.addEventListener("mouseleave", function () {
      title.classList.remove("scrolling");
    });
    item.appendChild(title);

    var actions = el("div", "feed-actions");

    var star = el("button", "feed-action-btn feed-star" + (mockup.favorite ? " starred" : ""),
                  { title: mockup.favorite ? "Unfavorite" : "Favorite", type: "button" });
    star.appendChild(text(mockup.favorite ? "★" : "☆"));
    star.addEventListener("click", function (e) {
      e.stopPropagation();
      toggleFavorite(mockup);
    });
    actions.appendChild(star);

    var copyBtn = el("button", "feed-action-btn feed-action-copy", { title: "Copy gallery link", type: "button" });
    copyBtn.appendChild(text("\u{1F517}"));
    copyBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      copyWithFlash(copyBtn, galleryLink(mockup), "\u2713", "\u2717");
    });
    actions.appendChild(copyBtn);

    // Direct link: the bare mockup at /view/{id}, with no gallery UI around it.
    var directBtn = el("button", "feed-action-btn feed-action-copy", { title: "Copy direct link", type: "button" });
    // Inline SVG (arrow out of a box), not a text glyph: no font dependency.
    directBtn.insertAdjacentHTML("afterbegin", '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>');
    directBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      copyWithFlash(directBtn, directLink(mockup), "\u2713", "\u2717");
    });
    actions.appendChild(directBtn);

    var delBtn = el("button", "feed-action-btn feed-action-delete", { title: "Delete", type: "button" });
    delBtn.appendChild(text("\u2715"));
    delBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      // A single-version design keeps the old no-confirm behaviour; a design
      // with history confirms and names the version count, since deleting it
      // takes every version with it.
      if (mockup.version_count >= 2 &&
          !confirm("Delete '" + mockup.title + "' and all " + mockup.version_count + " versions?")) {
        return;
      }
      deleteMockup(mockup.id).catch(function () {
        // Flash the button so a failed delete isn't a silent no-op.
        delBtn.classList.add("failed");
        setTimeout(function () { delBtn.classList.remove("failed"); }, 1500);
      });
    });
    actions.appendChild(delBtn);

    item.appendChild(actions);

    var meta = el("div", "feed-meta");

    var badge = el("span", "feed-badge");
    badge.appendChild(text(mockup.project));
    meta.appendChild(badge);

    var typeEl = el("span", "feed-type");
    typeEl.setAttribute("data-type", mockup.content_type);
    typeEl.appendChild(text(mockup.content_type));
    meta.appendChild(typeEl);

    if (mockup.version_count >= 2) {
      var chip = el("button", "ver-chip", { type: "button" });
      chip.appendChild(text(mockup.version_count + " versions"));
      chip.addEventListener("click", function (e) {
        e.stopPropagation();
        toggleVersionList(mockup, item, chip);
      });
      meta.appendChild(chip);
    }

    var time = el("span", "feed-time");
    time.appendChild(text(formatTime(mockup.created_at)));
    meta.appendChild(time);

    item.appendChild(meta);
    return item;
  }

  /* \u2500\u2500 Version chip + history list (feed rows) \u2500\u2500 */

  // Opens/closes the .ver-list under `item` for `mockup`, fetching its
  // versions from /api/mockups/{id} on first open and caching them in
  // versionsCache (invalidated on the next feed reload, see loadMockups).
  function toggleVersionList(mockup, item, chip) {
    var list = item.nextElementSibling;
    if (list && list.classList.contains("ver-list")) {
      var nowOpen = list.classList.toggle("open");
      chip.classList.toggle("open", nowOpen);
      return;
    }

    list = el("div", "ver-list open");
    chip.classList.add("open");
    item.insertAdjacentElement("afterend", list);

    var cached = versionsCache[mockup.id];
    if (cached) {
      renderVersionList(list, mockup, cached);
      return;
    }
    var loading = el("div", "ver-list-loading");
    loading.appendChild(text("Loading\u2026"));
    list.appendChild(loading);
    fetch("/api/mockups/" + encodeURIComponent(mockup.id))
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)); })
      .then(function (data) {
        versionsCache[mockup.id] = data.versions;
        renderVersionList(list, mockup, data.versions);
      })
      .catch(function () {
        clearChildren(list);
        var failed = el("div", "ver-list-loading");
        failed.appendChild(text("Couldn't load versions"));
        list.appendChild(failed);
      });
  }

  // (Re)draws the rows inside an open .ver-list from a cached `versions` array
  // (newest first, as returned by GET /api/mockups/{id}). Also used to refresh
  // highlighting after a selection changes while the list stays open.
  function renderVersionList(list, mockup, versions) {
    clearChildren(list);
    var latestNumber = versions.length ? versions[0].number : null;
    var isActiveDesign = state.activeMockupId === mockup.id;
    var effectiveActive = state.activeVersion == null ? latestNumber : state.activeVersion;

    versions.forEach(function (v) {
      var isLatest = v.number === latestNumber;
      var isRowActive = isActiveDesign && v.number === effectiveActive;
      var row = el("div", "ver-row" + (isRowActive ? " active" : ""));
      var activate = function () {
        if (isLatest) selectMockup(mockup.id);
        else selectMockup(mockup.id, v.number);
      };
      row.addEventListener("click", function (e) {
        if (e.target.closest(".ver-split")) return;
        activate();
      });
      makeActivatable(row, activate);

      var num = el("span", "ver-row-num");
      num.appendChild(text("v" + v.number));
      row.appendChild(num);

      var vTitle = el("span", "ver-row-title", { title: v.title });
      vTitle.appendChild(text(v.title));
      row.appendChild(vTitle);

      if (isLatest) {
        var tag = el("span", "ver-row-latest");
        tag.appendChild(text("latest"));
        row.appendChild(tag);
      }

      var vTime = el("span", "ver-row-time");
      vTime.appendChild(text(formatTime(v.created_at)));
      row.appendChild(vTime);

      var split = el("button", "ver-split", { type: "button", title: "Split into its own mockup" });
      split.insertAdjacentHTML("afterbegin", SPLIT_SVG);
      split.addEventListener("click", function (e) {
        e.stopPropagation();
        splitVersion(mockup, v, split);
      });
      row.appendChild(split);

      list.appendChild(row);
    });
  }

  // If `mockupId`'s row currently has its version list open, redraw it from
  // the cache so the highlighted "active" row follows a selection made
  // elsewhere (e.g. clicking the feed row itself, or a version row in the
  // list) without waiting for another fetch.
  function refreshOpenVersionList(mockupId) {
    var item = null;
    feedContainer.querySelectorAll(".feed-item").forEach(function (row) {
      if (row.getAttribute("data-id") === mockupId) item = row;
    });
    if (!item) return;
    var list = item.nextElementSibling;
    if (!list || !list.classList.contains("ver-list") || !list.classList.contains("open")) return;
    var cached = versionsCache[mockupId];
    if (!cached) return;
    var mockup = state.mockups.find(function (m) { return m.id === mockupId; }) || { id: mockupId };
    renderVersionList(list, mockup, cached);
  }

  function splitVersion(mockup, version, splitBtn) {
    if (!confirm("Split v" + version.number + " '" + version.title + "' into its own mockup?")) return;
    fetch("/api/mockups/" + encodeURIComponent(mockup.id) + "/versions/" + version.number + "/split", {
      method: "POST"
    })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)); })
      .then(function (newDesign) {
        Promise.all([loadProjects(), loadFavoritesCount()]).then(renderProjects);
        return loadMockups(true).then(function () { selectMockup(newDesign.id); });
      })
      .catch(function () {
        splitBtn.classList.add("failed");
        setTimeout(function () { splitBtn.classList.remove("failed"); }, 1500);
      });
  }

  /* ── Deselect ── */
  // #bar-left (eyebrow + menu toggle) is a persistent part of #meta-bar, not
  // dynamic content — clearing the bar back to its "nothing selected" state
  // must leave it standing and only clear what renderMetaBar() fills in:
  // #bar-left-row's star/copy/pop-out buttons and #bar-content's title/icons.
  function clearBarLeftRowExtras() {
    Array.from(barLeftRow.children).forEach(function (c) {
      if (c !== menuToggle) barLeftRow.removeChild(c);
    });
  }

  function resetMetaBarEmpty() {
    clearBarLeftRowExtras();
    clearChildren(barContent);
    metaBar.classList.add("empty");
    var hint = el("span", "meta-hint");
    hint.appendChild(text("Select a mockup to preview"));
    barContent.appendChild(hint);
  }

  function deselectMockup() {
    state.activeMockupId = null;
    state.activeVersion = null;
    activeMockupDetail = null;
    var url = new URL(window.location);
    url.searchParams.delete("mockup");
    url.searchParams.delete("v");
    history.replaceState(null, "", url);

    feedContainer.querySelectorAll(".feed-item").forEach(function (el) {
      el.classList.remove("active");
    });

    clearChildren(viewer);
    viewer.appendChild(createEmptyViewer());
    resetMetaBarEmpty();
  }

  /* ── URL + feed highlight sync ── */
  // `?mockup={id}` alone always means "latest" (follows future versions);
  // `&v={n}` pins the link to that version. Never a query string on /view —
  // only the gallery URL uses one (spec §7).
  function syncUrl(id, version) {
    var url = new URL(window.location);
    url.searchParams.set("mockup", id);
    if (version != null) url.searchParams.set("v", String(version));
    else url.searchParams.delete("v");
    history.replaceState(null, "", url);
  }

  function highlightActiveFeedRow(id) {
    feedContainer.querySelectorAll(".feed-item").forEach(function (row) {
      row.classList.toggle("active", row.getAttribute("data-id") === id);
    });
  }

  /* ── Clipboard ── */
  function galleryLink(mockup) {
    return window.location.origin + "/?mockup=" + encodeURIComponent(mockup.id);
  }

  // `version` omitted (or null) links to the latest, which is what every
  // caller except the viewer bar wants — the viewer bar passes state.activeVersion
  // so its copy-link/pop-out follow whichever version is currently on screen.
  function viewPath(id, version) {
    return "/view/" + encodeURIComponent(id) + (version != null ? "/v/" + version : "");
  }

  function directLink(mockup, version) {
    return window.location.origin + viewPath(mockup.id, version);
  }

  // Copy `str`, flash the button's label to okText/failText, then restore its original
  // content (text or icon markup). The idle markup is captured once, so a click during
  // the flash can't capture "✓" as the thing to restore.
  function copyWithFlash(btn, str, okText, failText) {
    if (btn._idleHTML === undefined) btn._idleHTML = btn.innerHTML;
    copyToClipboard(str).then(function (ok) {
      btn.textContent = ok ? okText : failText;
      btn.classList.add(ok ? "copied" : "failed");
      clearTimeout(btn._flashTimer);
      btn._flashTimer = setTimeout(function () {
        btn.innerHTML = btn._idleHTML;
        btn.classList.remove("copied", "failed");
      }, 1500);
    });
  }

  function copyToClipboard(str) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(str).then(function () { return true; }).catch(function () { return fallbackCopy(str); });
    }
    return Promise.resolve(fallbackCopy(str));
  }

  function fallbackCopy(str) {
    var ta = document.createElement("textarea");
    ta.value = str;
    ta.style.cssText = "position:fixed;left:-9999px;top:-9999px;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  /* ── Delete ── */
  async function toggleFavorite(mockup) {
    var next = !mockup.favorite;
    mockup.favorite = next;           // optimistic
    syncFavoriteUI(mockup);
    try {
      var resp = await fetch("/api/mockups/" + encodeURIComponent(mockup.id) + "/favorite", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ favorite: next })
      });
      if (!resp.ok) throw new Error("request failed");
      await loadFavoritesCount();
      renderProjects();
      // If we're viewing the favorites filter and just unfavorited, drop it from the feed
      if (state.activeProject === FAVORITES && !next) {
        state.mockups = state.mockups.filter(function (m) { return m.id !== mockup.id; });
        renderFeed(true);
      }
    } catch (e) {
      mockup.favorite = !next;        // rollback
      syncFavoriteUI(mockup);
    }
  }

  // Reflect mockup.favorite into the feed row (if shown) and the meta bar (if open).
  // Works no matter which star (feed or meta-bar) triggered the toggle.
  function syncFavoriteUI(mockup) {
    feedContainer.querySelectorAll(".feed-item").forEach(function (row) {
      if (row.getAttribute("data-id") !== mockup.id) return;
      row.classList.toggle("has-fav", mockup.favorite);
      var s = row.querySelector(".feed-star");
      if (s) {
        s.textContent = mockup.favorite ? "★" : "☆";
        s.title = mockup.favorite ? "Unfavorite" : "Favorite";
        s.classList.toggle("starred", mockup.favorite);
      }
    });
    if (state.activeMockupId !== mockup.id) return;
    // Re-render from activeMockupDetail (the full detail behind the current
    // view) rather than `mockup`, which may be only a feed-row summary and
    // lack the `versions` array a multi-version pill needs.
    if (activeMockupDetail && activeMockupDetail.id === mockup.id) {
      activeMockupDetail.favorite = mockup.favorite;
      renderMetaBar(activeMockupDetail, state.activeVersion);
    } else {
      renderMetaBar(mockup, state.activeVersion);
    }
  }

  async function deleteMockup(id) {
    var resp = await fetch("/api/mockups/" + encodeURIComponent(id), { method: "DELETE" });
    if (!resp.ok) throw new Error("delete failed: HTTP " + resp.status);

    // Remove from state
    state.mockups = state.mockups.filter(function (m) { return m.id !== id; });

    // If we deleted the active mockup, clear the viewer
    if (state.activeMockupId === id) {
      state.activeMockupId = null;
      state.activeVersion = null;
      activeMockupDetail = null;
      clearChildren(viewer);
      viewer.appendChild(createEmptyViewer());
      resetMetaBarEmpty();
    }

    renderFeed(true);
    Promise.all([loadProjects(), loadFavoritesCount()]).then(renderProjects);
  }

  function createEmptyViewer() {
    var wrap = el("div", "viewer-empty");
    var icon = el("div", "viewer-empty-icon");
    icon.insertAdjacentHTML("afterbegin", '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="3" x2="9" y2="9"/></svg>');
    wrap.appendChild(icon);
    var txt = el("div", "viewer-empty-text");
    txt.appendChild(text("No mockup selected"));
    wrap.appendChild(txt);
    return wrap;
  }

  /* ── Mockup Selection ── */
  // `version`: number to pin to a specific version, or omitted/null to follow
  // the latest. `id` may be a design id or, from a deep link (RF-5), an alias
  // id — fetchAndDisplay resolves that case and rewrites the URL.
  function selectMockup(id, version) {
    state.activeMockupId = id;
    state.activeVersion = version || null;

    // On mobile, dismiss the drawer so the chosen mockup is actually visible.
    setNav(false);

    syncUrl(id, state.activeVersion);
    highlightActiveFeedRow(id);

    var summary = state.mockups.find(function (m) { return m.id === id; });
    // A design with only one version renders straight from the feed summary
    // (today's fast path, no round trip). A design with several needs a full
    // fetch anyway: the pill's "latest" number can differ from version_count
    // once a version has been deleted (numbers are never reused, so gaps are
    // possible), and only /api/mockups/{id} returns the true one. An id with
    // no summary at all (not yet loaded, or an alias) also needs the fetch.
    if (!summary || summary.version_count >= 2) {
      fetchAndDisplay(id, state.activeVersion);
      return;
    }

    activeMockupDetail = summary;
    renderViewer(summary, state.activeVersion);
    renderMetaBar(summary, state.activeVersion);
  }

  async function fetchAndDisplay(id, version) {
    var mySeq = ++fetchSeq;
    var url = "/api/mockups/" + encodeURIComponent(id);
    if (version != null) url += "?v=" + version;
    var mockup;
    try {
      var resp = await fetch(url);
      if (!resp.ok) return;
      mockup = await resp.json();
    } catch (e) { return; /* network error — leave the current view in place */ }

    // Two guards against a stale response: the selection may have moved to a
    // different design entirely (activeMockupId check, as before), or — the
    // race this fixes — a second click on the SAME design (e.g. v2 then v3)
    // started a newer fetch that can resolve before this one. Only the
    // newest request's response may be applied; network order no longer
    // decides what wins, click order does.
    if (mySeq !== fetchSeq) return;
    if (state.activeMockupId !== id) return;

    // RF-5: `id` may have been an alias — GET /api/mockups/{id} resolves it
    // and returns the design's own id plus the version it's pinned to. Adopt
    // both and rewrite the URL so the alias never lingers in the address bar.
    var wasAlias = mockup.id !== id;
    state.activeMockupId = mockup.id;
    state.activeVersion = (version != null || wasAlias) ? mockup.version : null;

    syncUrl(state.activeMockupId, state.activeVersion);
    highlightActiveFeedRow(state.activeMockupId);

    activeMockupDetail = mockup;
    renderViewer(mockup, state.activeVersion);
    renderMetaBar(mockup, state.activeVersion);
    refreshOpenVersionList(state.activeMockupId);
  }

  function renderMetaBar(mockup, version) {
    clearBarLeftRowExtras();
    clearChildren(barContent);
    metaBar.classList.remove("empty");

    var metaStar = el("button", "meta-star" + (mockup.favorite ? " starred" : ""),
                      { title: mockup.favorite ? "Unfavorite" : "Favorite", type: "button" });
    metaStar.appendChild(text(mockup.favorite ? "★" : "☆"));
    metaStar.addEventListener("click", function (e) {
      e.stopPropagation();
      toggleFavorite(mockup);
    });
    barLeftRow.appendChild(metaStar);

    // Actions sit beside the star as icons, so the title keeps the width.
    var copyDirect = el("button", "meta-icon-btn", { title: "Copy direct link (no gallery UI)", type: "button" });
    copyDirect.insertAdjacentHTML("afterbegin", '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>');
    copyDirect.addEventListener("click", function () {
      copyWithFlash(copyDirect, directLink(mockup, version), "\u2713", "\u2717");
    });
    barLeftRow.appendChild(copyDirect);

    var popout = el("a", "meta-icon-btn", {
      href: viewPath(mockup.id, version),
      target: "_blank", rel: "noopener", title: "Pop out"
    });
    popout.insertAdjacentHTML("afterbegin", '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>');
    barLeftRow.appendChild(popout);

    barContent.appendChild(el("span", "meta-sep"));

    // The wrapper (not .meta-title) is the flex:1 item, so the pill sits
    // right after the title text instead of being pushed to the bar's far
    // right by a separately-growing title (task-5-review finding).
    var titleWrap = el("span", "meta-title-wrap");
    var title = el("span", "meta-title", { title: mockup.title });
    title.appendChild(text(mockup.title));
    titleWrap.appendChild(title);

    if (mockup.version_count >= 2) {
      // mockup.versions is newest-first; its first entry is the true latest
      // version number, which can differ from version_count once a version
      // has been deleted (numbers are never reused, so gaps are possible).
      var latestNumber = (mockup.versions && mockup.versions.length) ? mockup.versions[0].number : mockup.version;
      var shownVersion = mockup.version;
      var isLatest = shownVersion === latestNumber;
      var pill = el("span", "ver-pill" + (isLatest ? "" : " old"));
      pill.appendChild(text(isLatest
        ? ("v" + shownVersion + " · latest")
        : ("v" + shownVersion + " of " + mockup.version_count)));
      titleWrap.appendChild(pill);
    }

    barContent.appendChild(titleWrap);

    if (mockup.content_type === "html") {
      // Viewport: one device icon labelled with the current size, choices in a menu.
      var vpBtn = el("button", "meta-icon-btn meta-vp-btn", {
        title: "Viewport", type: "button", "aria-haspopup": "true", "aria-expanded": "false"
      });
      vpBtn.insertAdjacentHTML("afterbegin", '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>');
      var vpLabel = el("span", "meta-vp-label");
      vpLabel.appendChild(text("Full"));
      vpBtn.appendChild(vpLabel);
      var vpMenu = el("div", "meta-pop meta-vp-menu");
      [["mobile", "Mobile", "375"], ["tablet", "Tablet", "768"], ["desktop", "Desktop", "Full"]].forEach(function (v) {
        var row = el("button", "meta-vp-opt" + (v[0] === "desktop" ? " active" : ""), { type: "button" });
        row.appendChild(text(v[1]));
        var size = el("span", "meta-vp-size");
        size.appendChild(text(v[2]));
        row.appendChild(size);
        row.addEventListener("click", function () {
          setViewport(v[0]);
          vpMenu.querySelectorAll(".meta-vp-opt").forEach(function (r) { r.classList.toggle("active", r === row); });
          vpLabel.textContent = v[2];
          closeAllPopovers();
        });
        vpMenu.appendChild(row);
      });
      addMenu(vpBtn, vpMenu);

      var fsBtn = el("button", "meta-icon-btn", { title: "Fullscreen", type: "button" });
      fsBtn.insertAdjacentHTML("afterbegin", '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>');
      fsBtn.addEventListener("click", function () {
        if (viewer.requestFullscreen) viewer.requestFullscreen();
      });
      barContent.appendChild(fsBtn);
    }

    // Description, tags, project and time live in a popover behind the info button.
    var infoBtn = el("button", "meta-icon-btn", {
      title: "Details", type: "button", "aria-haspopup": "true", "aria-expanded": "false"
    });
    infoBtn.insertAdjacentHTML("afterbegin", '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>');
    var info = el("div", "meta-pop meta-info", { role: "dialog", "aria-label": "Mockup details" });
    if (mockup.description) addInfoField(info, "Description", mockup.description);
    if (mockup.tags && mockup.tags.length > 0) {
      var tagsWrap = el("div", "meta-info-tags");
      mockup.tags.forEach(function (t) {
        var tag = el("span", "meta-tag");
        tag.appendChild(text(t));
        tagsWrap.appendChild(tag);
      });
      addInfoField(info, "Tags", tagsWrap);
    }
    addInfoField(info, "Project", mockup.project);
    addInfoField(info, "Created", formatTime(mockup.created_at));
    addInfoField(info, "Versions", String(mockup.version_count));
    addMenu(infoBtn, info);
  }

  // Append a header button and the popover it toggles. One popover is open at a time.
  function addMenu(btn, pop) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var wasOpen = pop.classList.contains("open");
      closeAllPopovers();
      if (!wasOpen) {
        pop.classList.add("open");
        btn.setAttribute("aria-expanded", "true");
      }
    });
    pop.addEventListener("click", function (e) { e.stopPropagation(); });
    barContent.appendChild(btn);
    barContent.appendChild(pop);
  }

  function addInfoField(info, label, value) {
    var k = el("div", "meta-info-key");
    k.appendChild(text(label));
    info.appendChild(k);
    if (typeof value === "string") {
      var v = el("div", "meta-info-val");
      v.appendChild(text(value));
      info.appendChild(v);
    } else {
      info.appendChild(value);
    }
  }

  function setViewport(size) {
    viewer.classList.remove("vp-mobile", "vp-tablet");
    if (size === "mobile") viewer.classList.add("vp-mobile");
    else if (size === "tablet") viewer.classList.add("vp-tablet");
  }

  function renderViewer(mockup, version) {
    clearChildren(viewer);
    viewer.classList.remove("vp-mobile", "vp-tablet");

    var viewUrl = viewPath(mockup.id, version);

    if (mockup.content_type === "html") {
      var iframe = el("iframe", "viewer-iframe", {
        sandbox: "allow-scripts",
        src: viewUrl
      });
      viewer.appendChild(iframe);
    } else {
      // image types: png, jpg, svg
      var img = el("img", "viewer-image", {
        src: viewUrl,
        alt: mockup.title
      });
      viewer.appendChild(img);
    }
  }

  /* ── Filter Input ── */
  var filterTimer = null;
  filterInput.addEventListener("input", function () {
    clearTimeout(filterTimer);
    filterTimer = setTimeout(function () {
      state.filterText = filterInput.value.trim();
      loadMockups(true);
    }, 200);
  });

  /* ── Sort Control ── */
  var sortSeg = document.getElementById("sort-seg");
  function applySort(opt) {
    if (!opt) return;
    sortSeg.querySelectorAll(".sort-opt").forEach(function (o) { o.classList.remove("active"); });
    opt.classList.add("active");
    state.sort = opt.getAttribute("data-sort");
    loadMockups(true);
  }
  sortSeg.querySelectorAll(".sort-opt").forEach(function (o) {
    o.setAttribute("role", "button");
    o.setAttribute("tabindex", "0");
  });
  sortSeg.addEventListener("click", function (e) {
    applySort(e.target.closest(".sort-opt"));
  });
  sortSeg.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var opt = e.target.closest(".sort-opt");
    if (!opt) return;
    e.preventDefault();
    applySort(opt);
  });

  /* ── Infinite Scroll ── */
  feedContainer.addEventListener("scroll", function () {
    if (state.loading || state.exhausted) return;
    var threshold = feedContainer.scrollHeight - feedContainer.scrollTop - feedContainer.clientHeight;
    if (threshold < 120) {
      loadMockups(false);
    }
  });

  /* ── Direct Link Support ── */
  function getInitialMockupId() {
    var params = new URLSearchParams(window.location.search);
    return params.get("mockup") || null;
  }

  function getInitialVersion() {
    var params = new URLSearchParams(window.location.search);
    var v = params.get("v");
    return v ? parseInt(v, 10) : null;
  }

  /* ── Setup Guide Link ── */
  function updateGuideLink() {
    var link = document.getElementById("guide-link");
    if (!link) return;
    var guide = state.mockups.find(function (m) { return m.title === "Setup Guide"; });
    if (!guide) return;
    link.href = "#";
    link.style.display = "";
    // Assign (not addEventListener) so repeated calls from the poll don't stack
    // duplicate handlers on this persistent element. Resolve the id at click
    // time so it stays current across refreshes.
    link.onclick = function (e) {
      e.preventDefault();
      var g = state.mockups.find(function (m) { return m.title === "Setup Guide"; });
      if (g) selectMockup(g.id);
    };
  }

  /* ── Auto-refresh ── */
  var POLL_INTERVAL = 5000;
  var lastPollSig = null;

  async function pollForUpdates() {
    try {
      // Probe the current view and build a signature over id + updated_at +
      // favorite. Comparing the whole signature (not just the newest-inserted
      // id) means we also catch deletions, metadata/content edits, and favorite
      // toggles made by other clients/agents — not only new inserts. Capped at
      // 200 rows; a change to an item below that in a very long scrolled feed
      // won't trigger until the next reset.
      var probeLimit = Math.min(Math.max(state.mockups.length, 1), 200);
      var url = "/api/mockups?limit=" + probeLimit + "&sort=newest";
      if (state.activeProject === FAVORITES) url += "&favorites_only=true";
      else if (state.activeProject) url += "&project=" + encodeURIComponent(state.activeProject);
      if (state.filterText) url += "&q=" + encodeURIComponent(state.filterText);
      var resp = await fetch(url);
      if (!resp.ok) return;
      var data = await resp.json();

      var sig = data.map(function (m) {
        return m.id + ":" + m.updated_at + ":" + (m.favorite ? 1 : 0);
      }).join("|");

      if (lastPollSig === null) { lastPollSig = sig; return; }
      if (sig !== lastPollSig) {
        lastPollSig = sig;
        await loadProjects();
        await loadMockups(true);
        updateGuideLink();
      }
    } catch (e) {
      // silently skip on network errors
    }
  }

  setInterval(pollForUpdates, POLL_INTERVAL);

  /* ── Init ── */
  async function init() {
    await loadProjects();
    await loadFavoritesCount();
    renderProjects();
    await loadMockups(true);
    updateGuideLink();

    var initialId = getInitialMockupId();
    if (initialId) {
      selectMockup(initialId, getInitialVersion());
    } else if (state.mockups.length > 0) {
      // Auto-select most recent
      selectMockup(state.mockups[0].id);
    }
  }

  init();
})();
</script>
</body>
</html>
